<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход | KEYZPANEL</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    
    <!-- Custom CSS -->
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #0D1B2A;
            --secondary-light: #1B263B;
            --accent: #415A77;
            --card-bg: #1E1E1E;
            --card-hover: #252525;
            --text-light: #E0E1DD;
            --text-muted: #8A8D93;
            --text-dark: #FFFFFF;
            --success: #4CAF50;
            --info: #2196F3;
            --danger: #F44336;
            --gradient-primary: linear-gradient(135deg, #FF6B35 0%, #FF8E53 100%);
            --gradient-dark: linear-gradient(135deg, #0D1B2A 0%, #1B263B 100%);
            --gradient-gold: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --card-shadow-hover: 0 12px 48px rgba(255, 107, 53, 0.2);
            --card-shadow-gold: 0 8px 32px rgba(255, 215, 0, 0.2);
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--gradient-dark);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            background: var(--gradient-primary);
            border-radius: 50%;
            pointer-events: none;
            animation: float-particle linear infinite;
        }
        
        @keyframes float-particle {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Content wrapper */
        .content-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
        }
        
        .login-container {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
        }
        
        .login-card {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }
        
        .login-card:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }
        
        .logo-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.1), rgba(255, 215, 0, 0.1));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            position: relative;
            border: 2px solid rgba(255, 107, 53, 0.3);
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 8px 32px rgba(255, 107, 53, 0.2);
        }
        
        .logo-icon i {
            font-size: 3.5rem;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }
        
        .logo-icon:before {
            content: '';
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid rgba(255, 107, 53, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }
        
        .logo-icon:after {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 1px solid rgba(255, 215, 0, 0.1);
            animation: pulse 3s ease-in-out infinite;
            animation-delay: 0.5s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(1.05); }
        }
        
        .logo-text {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(255, 107, 53, 0.3);
        }
        
        .logo-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 0.75rem;
            display: block;
        }
        
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            border-radius: 12px;
            padding: 0.875rem 1rem;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        .form-control:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2);
            color: var(--text-dark);
        }
        
        .form-control::placeholder {
            color: var(--text-muted);
        }
        
        .input-group-text {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-right: none;
            color: var(--text-muted);
        }
        
        .btn-primary {
            background: var(--gradient-primary);
            border: none;
            color: white;
            font-weight: 700;
            padding: 1rem;
            border-radius: 12px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(255, 107, 53, 0.3);
            letter-spacing: 0.5px;
            font-size: 1.1rem;
        }
        
        .btn-primary:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255, 107, 53, 0.4);
        }
        
        .btn-primary:hover:before {
            left: 100%;
        }
        
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            background: rgba(244, 67, 54, 0.1);
            color: var(--text-light);
            border-left: 4px solid var(--danger);
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .alert-success {
            background: rgba(76, 175, 80, 0.1);
            border-left-color: var(--success);
        }
        
        .btn-close {
            filter: invert(1);
            opacity: 0.7;
        }
        
        .btn-close:hover {
            opacity: 1;
        }
        
        .links {
            text-align: center;
            margin-top: 2rem;
        }
        
        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
        
        .links a:hover {
            background: rgba(255, 107, 53, 0.1);
            transform: translateX(5px);
        }
        
        .session-check {
            text-align: center;
            margin-top: 1rem;
            font-size: 1rem;
            color: var(--text-muted);
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--secondary);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--gradient-primary);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }
        
        /* Selection color */
        ::selection {
            background: rgba(255, 107, 53, 0.3);
            color: white;
        }
        
        /* Professional key icon styles */
        .key-icon {
            position: relative;
            display: inline-block;
        }
        
        .key-icon .fa-key {
            position: relative;
            z-index: 2;
        }
        
        .key-icon:before {
            content: '\f084';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 2px;
            left: -2px;
            color: rgba(255, 215, 0, 0.3);
            z-index: 1;
        }
        
        @media (max-width: 576px) {
            .login-card {
                padding: 2rem 1.5rem;
            }
            
            .logo-text {
                font-size: 2rem;
            }
            
            .logo-icon {
                width: 80px;
                height: 80px;
            }
            
            .logo-icon i {
                font-size: 2.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Particles -->
    <div class="particles" id="particles"></div>
    
    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <div class="login-container">
            <div class="login-card">
                <div class="logo">
                    <div class="logo-container">
                        <div class="logo-icon">
                            <div class="key-icon">
                                <i class="fas fa-key"></i>
                            </div>
                        </div>
                    </div>
                    <div class="logo-text">KEYZPANEL</div>
                    <div class="logo-subtitle">Professional Key Management</div>
                </div>
                
                <!-- Проверка сессии -->
                <div class="session-check" id="sessionCheck" style="display: none;">
                    <i class="fas fa-spinner fa-spin me-2"></i>
                    Проверяем авторизацию...
                </div>
                
                <form method="POST" id="loginForm" style="display: none;">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                                    <i class="fas fa-{{ 'exclamation-triangle' if category == 'error' else 'check-circle' }} me-2"></i>
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    
                    <div class="mb-4">
                        <label for="username" class="form-label">
                            <i class="fas fa-user-circle me-2"></i>Имя пользователя
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="Введите ваш логин">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">
                            <i class="fas fa-shield-alt me-2"></i>Пароль
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="Введите ваш пароль">
                        </div>
                    </div>
                    
                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <i class="fas fa-sign-in-alt me-2"></i>Войти в аккаунт
                        </button>
                    </div>
                </form>
                
                <div class="links">
                    <a href="/register">
                        <i class="fas fa-user-plus me-2"></i>Нет аккаунта? Зарегистрироваться
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Create animated particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 3 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.top = `${Math.random() * 100}vh`;
                particle.style.opacity = Math.random() * 0.5 + 0.1;
                
                // Random gradient for particles
                if (Math.random() > 0.5) {
                    particle.style.background = 'linear-gradient(135deg, #FFD700 0%, #FFA500 100%)';
                }
                
                const duration = Math.random() * 10 + 15;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                
                container.appendChild(particle);
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            
            const sessionCheck = document.getElementById('sessionCheck');
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            
            // Показываем индикатор проверки
            sessionCheck.style.display = 'block';
            
            // Проверяем наличие активной сессии
            fetch('/dashboard', {
                method: 'GET',
                credentials: 'same-origin'
            })
            .then(response => {
                if (response.redirected) {
                    setTimeout(() => {
                        sessionCheck.style.display = 'none';
                        loginForm.style.display = 'block';
                        document.getElementById('username').focus();
                    }, 500);
                } else {
                    window.location.href = '/dashboard';
                }
            })
            .catch(error => {
                console.error('Error checking session:', error);
                setTimeout(() => {
                    sessionCheck.style.display = 'none';
                    loginForm.style.display = 'block';
                    document.getElementById('username').focus();
                }, 500);
            });
            
            // Обработка отправки формы
            loginForm.addEventListener('submit', function(e) {
                const submitBtn = this.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Вход...';
                submitBtn.disabled = true;
            });
            
            // Эффект для поля ввода при фокусе
            const inputs = document.querySelectorAll('.form-control');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.parentElement.style.transform = 'scale(1.02)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.parentElement.style.transform = 'scale(1)';
                });
            });
            
            // Анимация для кнопки при наведении
            const button = document.getElementById('submitBtn');
            button.addEventListener('mouseenter', function() {
                const icon = this.querySelector('i');
                icon.style.transform = 'translateX(5px)';
            });
            
            button.addEventListener('mouseleave', function() {
                const icon = this.querySelector('i');
                icon.style.transform = 'translateX(0)';
            });
        });
    </script>
</body>
</html>
