<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Технические работы | KEYZPANEL</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">

    <style>
        :root {
            --primary: #FF6B35;
            --secondary: #0D1B2A;
            --card-bg: #1E1E1E;
            --text-light: #E0E1DD;
            --text-muted: #8A8D93;
            --gradient-primary: linear-gradient(135deg, #FF6B35 0%, #FF8E53 100%);
            --gradient-dark: linear-gradient(135deg, #0D1B2A 0%, #1B263B 100%);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        body {
            background: var(--gradient-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .maintenance-card {
            background: rgba(30, 30, 30, 0.9);
            border-radius: 18px;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: var(--card-shadow);
            border-top: 4px solid var(--primary);
        }

        .maintenance-icon {
            font-size: 4.5rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            animation: spin 6s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .maintenance-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .maintenance-text {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .maintenance-info {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .btn-primary {
            background: var(--gradient-primary);
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            color: #fff;
        }

        .btn-primary:hover {
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.4);
            transform: translateY(-2px);
        }

        @media (max-width: 576px) {
            .maintenance-card {
                padding: 2rem 1.5rem;
            }

            .maintenance-icon {
                font-size: 3.5rem;
            }

            .maintenance-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="maintenance-icon">
            <i class="fas fa-tools"></i>
        </div>

        <h1 class="maintenance-title">Технические работы</h1>

        <p class="maintenance-text">
            Мы временно проводим обслуживание сервиса, чтобы сделать KEYZPANEL ещё быстрее и стабильнее.
        </p>

        <div class="maintenance-info">
            ⏳ Пожалуйста, зайдите чуть позже.<br>
        </div>
    </div>

</body>
</html>
